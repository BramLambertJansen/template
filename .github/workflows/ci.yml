# Snelle job op elke push en PR (framework §10); check:new-resource als eigen job (ADR 0016, OV-7). gate:slow, CodeQL, osv-scanner, Betterleaks en de diff-guard volgen
# in roadmap stuk 4. Actions op volledige SHA; Renovate werkt ze bij.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate-fast:
    name: gate:fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check:migrations vergelijkt met origin/main; een shallow checkout heeft die niet.
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:fast
      - run: pnpm build

  # Code uit pnpm new:resource haalt gate:fast (ADR 0016, OV-7). Duurt minuten, daarom niet in gate:fast zelf; wel altijd,
  # want de templates doen bijna alles in src/ na.
  new-resource:
    name: check:new-resource
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:new-resource
