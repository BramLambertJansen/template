# Achterstand in dependency-updates (spec dependency-achterstand): wekelijks, na de Renovate-run van maandagochtend, rood als
# een Renovate-PR te lang openstaat (14 dagen, beveiliging 7, major 60) of Renovate een update niet als PR kan openen of een
# fout meldt. Leest alleen; geen PR-check, zodat een hangende update geen andere PR rood maakt (R-CI-01).
name: dependency-achterstand

on:
  schedule:
    - cron: "23 6 * * 2"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: dependency-achterstand
  cancel-in-progress: false

jobs:
  dependency-achterstand:
    name: dependency-achterstand
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          install_args: node
      - name: dependency-achterstand
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/kit/dependency-achterstand.mjs
