# Eén pakket; dit bestand bestaat voor de pnpm-instellingen (supply chain, docs/framework.md §6).
packages:
  - "."

# Nieuwe versies pas na 7 dagen (in minuten).
minimumReleaseAge: 10080
# Weiger een versie die met minder vertrouwen gepubliceerd is dan de vorige.
trustPolicy: no-downgrade
# Install-scripts alleen voor expliciet toegestane pakketten.
strictDepBuilds: true
# lefthook: geen postinstall; scripts/bootstrap.sh draait `lefthook install` zelf.
allowBuilds:
  lefthook: false
# node_modules zonder symlinks buiten de repo: de runner mount alleen de repo (ADR 0009).
enableGlobalVirtualStore: false
